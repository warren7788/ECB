    <style>
        /* Iframe & Mobile Scroll Fixes */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
        }
        
        #root {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out; }
        
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-scale-in { animation: scaleIn 0.15s ease-out; }

        @keyframes pulse-subtle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .animate-pulse-subtle { animation: pulse-subtle 1.5s infinite; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .writing-vertical-rl { writing-mode: vertical-rl; }
        .writing-horizontal-tb { writing-mode: horizontal-tb; }

        /* Drag and Drop Styles */
        .draggable-item { cursor: grab; }
        .draggable-item:active { cursor: grabbing; }
        .drag-over { border: 2px dashed #3b82f6; background-color: #eff6ff; }
    </style>

        const Shirt = (p) => <IconBase {...p}><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></IconBase>;

        const FileUp = (p) => <IconBase {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M12 12v6"/><path d="M9 15l3-3 3 3"/></IconBase>;
        const Maximize = (p) => <IconBase {...p}><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></IconBase>;
        const Settings = (p) => <IconBase {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>;
        const History = (p) => <IconBase {...p}><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></IconBase>;
        const AlertTriangle = (p) => <IconBase {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconBase>;
        const FileText = (p) => <IconBase {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></IconBase>;
        const Megaphone = (p) => <IconBase {...p}><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></IconBase>;
        const Pin = (p) => <IconBase {...p}><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17z"/></IconBase>;
        const Grid = (p) => <IconBase {...p}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></IconBase>;
        const GripVertical = (p) => <IconBase {...p}><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></IconBase>;
        const ExternalLink = (p) => <IconBase {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></IconBase>;
		const HelpCircle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10" fill="none" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" y1="17" x2="12.01" y2="17" /></IconBase>;
		const Circle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/></IconBase>;
        const PlayCircle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></IconBase>;
        const CheckCircle = (p) => <IconBase {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>;
        const MessageSquare = (p) => <IconBase {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></IconBase>;
		const ClipboardCheck = (p) => <IconBase {...p}><rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="m9 14 2 2 4-4" /></IconBase>;
        
		const getWeekDay = (d) => { if(!d)return''; const dt=new Date(d.replace(/-/g,'/')); return ['日','一','二','三','四','五','六'][dt.getDay()]; };
        
        // 顯示時，將 yyyy-mm-dd 替換為 yyyy/mm/dd
        const formatDateWithWeek = (d) => d ? `${d.replace(/-/g, '/')} (${getWeekDay(d)})` : '';
        const getMonthStr = (d) => d.slice(0, 7);

        const SUBJECT_CONFIG = [
            { name: '國文', color: 'bg-rose-100 text-rose-800' },
            { name: '英文', color: 'bg-blue-100 text-blue-800' },
            { name: '數學', color: 'bg-emerald-100 text-emerald-800' },
            { name: '物理', color: 'bg-purple-100 text-purple-800' },
            { name: '化學', color: 'bg-fuchsia-100 text-fuchsia-800' },
            { name: '生物', color: 'bg-teal-100 text-teal-800' },
            { name: '地科', color: 'bg-cyan-100 text-cyan-800' },
            { name: '歷史', color: 'bg-orange-100 text-orange-800' },
            { name: '地理', color: 'bg-amber-100 text-amber-800' },
            { name: '公民', color: 'bg-yellow-100 text-yellow-800' },
            { name: '班務', color: 'bg-slate-200 text-slate-800' },
            { name: '其他', color: 'bg-gray-100 text-gray-800' }
        ];
        
        const SUBJECT_ORDER_MAP = SUBJECT_CONFIG.reduce((acc, cur, idx) => ({ ...acc, [cur.name]: idx }), {});
        const SUBJECT_COLOR_MAP = SUBJECT_CONFIG.reduce((acc, cur) => ({ ...acc, [cur.name]: cur.color }), {});
        const DEFAULT_COLOR = 'bg-gray-100 text-gray-800';

        const getSubjectColor = (s) => SUBJECT_COLOR_MAP[s] || DEFAULT_COLOR;
        const getSubjectOrder = (s) => SUBJECT_ORDER_MAP[s] !== undefined ? SUBJECT_ORDER_MAP[s] : 999;

		// 格式化文字邏輯
		const renderContent = (text) => {
		  if (!text) return "";

		  // 拆分 [重點] 或 !警告!
		  const parts = text.split(/(\[.*?\]|!.*?!)/g);

		  return parts.map((part, i) => {
			// 藍色重點：[文字]
			if (part.startsWith("[") && part.endsWith("]")) {
			  return (
				<span
				  key={i}
				  className="font-black text-blue-600 underline decoration-blue-600"
				>
				  {part.slice(1, -1)}
				</span>
			  );
			}

			// 紅色警告：!文字!
			if (part.startsWith("!") && part.endsWith("!")) {
			  return (
				<span
				  key={i}
				  className="font-black text-rose-600"
				>
				  {part.slice(1, -1)}
				</span>
			  );
    }

    // 其他正常文字
    return <span key={i}>{part}</span>;
  });
};

		// 教學圖示組件
		const FormatHelp = () => (
			<div className="group relative inline-block ml-1 align-middle">
				<HelpCircle className="w-4 h-4 text-slate-400 cursor-help hover:text-slate-800 transition-colors" />
				<div className="invisible group-hover:visible absolute top-0 left-full ml-2 z-[100] w-36 p-1.5 text-[11px] leading-relaxed text-slate-800 bg-gray-100 rounded-lg shadow-xl border border-gray-300">
					<p className="font-bold border-b border-gray-400 mb-1 pb-1 text-xs">特殊格式教學</p>
					<p>1. <span className="text-blue-600 font-bold">[藍色]</span> (前後加<span className="text-blue-600 font-bold">[ ]</span> )</p>
					<p>2. <span className="text-rose-600 font-bold">!紅色!</span> (前後加<span className="text-rose-600 font-bold">!</span> )</p>
				</div>
			</div>
		);

        const TYPE_PRIORITY = { exam: 1, homework: 2, report: 3, reminder: 4, other: 5 };
        const TYPE_LABEL = { exam: '考試', homework: '作業', report: '報告', reminder: '提醒', other: '其他' };
        
        const getTypeLabelStyle = (type) => {
            switch(type) {
                case 'exam': return 'text-rose-500 bg-rose-50 border-rose-100';
                case 'homework': return 'text-blue-500 bg-blue-50 border-blue-100';
                case 'report': return 'text-indigo-500 bg-indigo-50 border-indigo-100';
                case 'reminder': return 'text-orange-500 bg-orange-50 border-orange-100';
                default: return 'text-gray-500 bg-gray-50 border-gray-100';
            }
        };

        const renderTextWithLinks = (text) => {
            if (!text) return '無詳細內容';
            const parts = text.split(/(https?:\/\/[^\s]+)/g);
            return (
                <>
                    {parts.map((part, i) => {
                        if (part.match(/https?:\/\/[^\s]+/)) {
                            return <a key={i} href={part} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline break-all" onClick={(e) => e.stopPropagation()}>{part}</a>;
                        }
                        return part;
                    })}
                </>
            );
        };

        const Modal = ({ isOpen, onClose, title, children, footer, size = "max-w-2xl" }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fade-in" style={{zIndex: 9999}}>
                    <div className={`bg-white rounded-2xl shadow-2xl w-full ${size} overflow-hidden animate-scale-in flex flex-col max-h-[90vh]`}>
                        <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white sticky top-0 z-10">
                            <h3 className="text-lg font-bold text-slate-800">{title}</h3>
                            <button onClick={onClose} className="p-1 rounded-full hover:bg-slate-100 transition-colors text-slate-400"><X className="w-5 h-5" /></button>
                        </div>
                        <div className="p-6 overflow-y-auto custom-scrollbar">{children}</div>
                        {footer && <div className="px-6 py-4 border-t border-slate-50 bg-slate-50 flex justify-end gap-3 sticky bottom-0">{footer}</div>}
                    </div>
                </div>
            );
        };

        const CalendarSidebar = ({ selectedDate, setSelectedDate, todayStr, availableDatesMap, renderCalendarGrid, closeModal }) => {
            const [y, m] = selectedDate.split('-').map(Number);
            const [viewYear, setViewYear] = useState(y);
            const [viewMonth, setViewMonth] = useState(m);

            useEffect(() => {
                if (selectedDate) {
                    const [y, m] = selectedDate.split('-').map(Number);
                    setViewYear(y);
                    setViewMonth(m);
                }
            }, [selectedDate]);

            const currentYear = new Date().getFullYear();
            const years = Array.from({length: 5}, (_, i) => currentYear - 2 + i);
            const months = Array.from({length: 12}, (_, i) => i + 1);

            const handleYearChange = (e) => setViewYear(Number(e.target.value));
            const handleMonthChange = (e) => setViewMonth(Number(e.target.value));

            const currentMonthStr = `${viewYear}-${String(viewMonth).padStart(2, '0')}`;

            return (
                <div className="flex flex-col h-full bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <div className="p-4 border-b border-slate-100 bg-slate-50 flex gap-2">
                        <div className="relative flex-1">
                            <select value={viewYear} onChange={handleYearChange} className="w-full p-2 pl-3 pr-8 appearance-none bg-white border border-slate-200 rounded-lg text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                {years.map(y => <option key={y} value={y}>{y}年</option>)}
                            </select>
                            <ChevronDown className="w-4 h-4 text-slate-400 absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none" />
                        </div>
                        <div className="relative flex-1">
                            <select value={viewMonth} onChange={handleMonthChange} className="w-full p-2 pl-3 pr-8 appearance-none bg-white border border-slate-200 rounded-lg text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                {months.map(m => <option key={m} value={m}>{m}月</option>)}
                            </select>
                            <ChevronDown className="w-4 h-4 text-slate-400 absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none" />
                        </div>
                    </div>

                    <div className="p-3 flex-1 overflow-y-auto custom-scrollbar">
                        <div className="grid grid-cols-7 gap-1 mb-2 text-center">
                            {['日','一','二','三','四','五','六'].map(d => (
                                <span key={d} className="text-xs font-black text-slate-300">{d}</span>
                            ))}
                        </div>
                        <div className="grid grid-cols-7 gap-1">
                            {renderCalendarGrid(currentMonthStr).map((day, idx) => {
                                if (!day) return <div key={idx}></div>;
                                const dateStr = `${currentMonthStr}-${String(day).padStart(2, '0')}`;
                                const isSelected = selectedDate === dateStr;
                                const isToday = dateStr === todayStr;
                                const hasEvents = availableDatesMap.has(dateStr);
                                
                                return (
                                    <button 
                                        key={dateStr} 
                                        onClick={() => { setSelectedDate(dateStr); if(closeModal) closeModal(); }} 
                                        className={`aspect-square rounded-lg flex flex-col items-center justify-center transition-all relative ${isSelected ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'} ${!hasEvents && !isSelected ? 'opacity-50' : ''}`}
                                    >
                                        <span className={`text-sm font-bold leading-none ${isSelected ? 'text-white' : 'text-slate-700'}`}>{day}</span>
                                        {isToday && !isSelected && <div className="absolute top-1 right-1 w-1.5 h-1.5 bg-rose-400 rounded-full"></div>}
                                        {hasEvents && !isSelected && <div className="absolute bottom-1 w-1 h-1 bg-blue-400 rounded-full"></div>}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };
			// ================= 交辦幹部事項區塊 (智慧鎖定身分 + Modal警告版) =================
			const CadreTaskSection = ({ isTeacherMode, db, tasks = [] }) => {
				// 預設幹部清單
				const CADRE_ROLES = ["班長", "副班長", "總務", "學藝", "衛生"];

				const renderContentWithLinks = (text) => {
					if (!text) return null;
					const urlRegex = /(https?:\/\/[^\s]+)/g;
					const parts = text.split(urlRegex);
					return parts.map((part, index) => {
						if (part.match(urlRegex)) {
							return (
								<a key={index} href={part} target="_blank" rel="noopener noreferrer" 
								   className="text-blue-500 hover:text-blue-700 underline break-all"
								   onClick={(e) => e.stopPropagation()}>
									{part}
								</a>
							);
						}
						return part;
					});
				};
				
				const [isModalOpen, setIsModalOpen] = useState(false);
				const [currentTask, setCurrentTask] = useState(null);
				
				// 編輯狀態
				const [editTitle, setEditTitle] = useState("");
				const [editDeadline, setEditDeadline] = useState("");
				const [editStatus, setEditStatus] = useState("pending");
				const [editTargetCadre, setEditTargetCadre] = useState(""); 
				const [isCustomTargetMode, setIsCustomTargetMode] = useState(false);

				// 回報狀態
				const [reportContent, setReportContent] = useState("");
				const [tempCadreName, setTempCadreName] = useState(""); // 暫存輸入的職稱
				
				// 刪除確認 Modal
				const [isDeleteModalOpen, setIsDeleteModalOpen] = useState(false);
				const [taskToDelete, setTaskToDelete] = useState(null);

				// ★ 新增：警告 Modal 狀態
				const [alertConfig, setAlertConfig] = useState({ isOpen: false, message: "" });
				
				const [expandedTaskIds, setExpandedTaskIds] = useState(new Set());


				const getTodayStr = () => new Date().toISOString().split('T')[0];

				const formatFullTime = (ts) => {
					if (!ts) return "";
					const d = new Date(ts);
					return d.toLocaleString('zh-TW', {
						year: 'numeric', month: 'numeric', day: 'numeric',
						hour: '2-digit', minute: '2-digit', hour12: false
					});
				};

				const toggleTaskExpand = (taskId) => {
					setExpandedTaskIds(prev => {
						const newSet = new Set(prev);
						if (newSet.has(taskId)) newSet.delete(taskId);
						else newSet.add(taskId);
						return newSet;
					});
				};

				const handleOpenModal = (task) => {
					setCurrentTask(task);
					setEditTitle(task ? task.title : "");
					setEditDeadline(task ? task.deadline : getTodayStr());
					setEditStatus(task ? task.status : "pending");
					
					// 處理指定幹部邏輯
					const target = task ? (task.targetCadre || "") : "";
					setEditTargetCadre(target);
					const isPredefined = target === "" || CADRE_ROLES.includes(target);
					setIsCustomTargetMode(!isPredefined);
					
					setReportContent("");
					setTempCadreName(""); // 每次打開都清空輸入框，不記憶
					setIsModalOpen(true);
				};

				const handleSaveTask = async () => {
					if (!editTitle.trim()) {
						setAlertConfig({ isOpen: true, message: "請輸入任務內容" });
						return;
					}
					
					let finalTargetCadre = editTargetCadre;
					if (isCustomTargetMode && !editTargetCadre.trim()) {
						finalTargetCadre = "";
					}

					const taskData = {
						title: editTitle,
						deadline: editDeadline,
						status: editStatus,
						targetCadre: finalTargetCadre, 
						updatedAt: new Date().toISOString()
					};
					if (currentTask && currentTask.id) {
						await db.collection('cadre_tasks').doc(currentTask.id).update(taskData);
					} else {
						await db.collection('cadre_tasks').add({
							...taskData,
							createdAt: new Date().toISOString(),
							reports: []
						});
					}
					setIsModalOpen(false);
				};

				// ★ 取得該任務已鎖定的學生身分 (若無則回傳 null)
				const getLockedStudentIdentity = () => {
					if (!currentTask || !currentTask.reports) return null;
					// 找到第一個非導師的留言者
					const studentReport = currentTask.reports.find(r => r.name !== '導師');
					return studentReport ? studentReport.name : null;
				};

				const handleAddReport = async () => {
					// ★ 驗證 1：內容不能為空
					if (!reportContent.trim()) {
						setAlertConfig({ isOpen: true, message: "請輸入回報內容" });
						return;
					}
					
					let reporterName;

					if (isTeacherMode) {
						reporterName = "導師";
					} else {
						// ★ 學生身分邏輯
						const lockedIdentity = getLockedStudentIdentity();
						
						if (lockedIdentity) {
							// 如果已經有人回報過，直接沿用該身分
							reporterName = lockedIdentity;
						} else {
							// 如果是第一次，檢查輸入框
							if (!tempCadreName.trim()) {
								setAlertConfig({ isOpen: true, message: "第一次回報請輸入您的職稱" });
								return;
							}
							reporterName = tempCadreName;
						}
					}

					const newReport = { name: reporterName, content: reportContent, timestamp: new Date().toISOString() };
					const updatedReports = [...(currentTask.reports || []), newReport];
					await db.collection('cadre_tasks').doc(currentTask.id).update({ reports: updatedReports });
					setCurrentTask(prev => ({ ...prev, reports: updatedReports }));
					setReportContent("");
					// 注意：不清除 tempCadreName，避免用戶想連續發言覺得要重打很煩，雖然 UI 上可能已經變成鎖定狀態
				};

				const handleSelectChange = (e) => {
					const val = e.target.value;
					if (val === "__OTHER__") {
						setIsCustomTargetMode(true);
						setEditTargetCadre("");
					} else {
						setIsCustomTargetMode(false);
						setEditTargetCadre(val);
					}
				};

				const handleRequestDelete = (e, task) => {
					if(e) e.stopPropagation(); 
					setTaskToDelete(task);
					setIsDeleteModalOpen(true);
				};

				const handleConfirmDelete = async () => {
					if (!taskToDelete) return;
					await db.collection('cadre_tasks').doc(taskToDelete.id).delete();
					setIsDeleteModalOpen(false);
					setTaskToDelete(null);
					if (isModalOpen) setIsModalOpen(false);
				};

				const STATUS_MAP = {
					pending: { label: '未開始', color: 'bg-slate-500 text-white border-slate-600 shadow-md' },
					processing: { label: '進行中', color: 'bg-blue-500 text-white border-blue-600 shadow-md' },
					stuck: { label: '卡關', color: 'bg-rose-500 text-white border-rose-600 shadow-md' },
					done: { label: '已完成', color: 'bg-emerald-500 text-white border-emerald-600 shadow-md' }
				};

				const renderReports = (reports) => {
					if (!reports || reports.length === 0) return <div className="text-slate-400 text-xs italic">尚無回報</div>;
					return reports.map((r, i) => {
						const isTeacherReport = r.name === '導師';
						return (
							<div key={i} className={`p-2 rounded border shadow-sm ${isTeacherReport ? 'bg-blue-50 border-blue-100' : 'bg-white border-purple-50'}`}>
								<div className="flex justify-between items-center mb-1">
									<span className={`font-bold text-xs ${isTeacherReport ? 'text-blue-600' : 'text-purple-700'}`}>
										{r.name}
									</span>
									<span className="text-[10px] text-slate-400">{formatFullTime(r.timestamp)}</span>
								</div>
								<div className={`text-xs leading-snug ${isTeacherReport ? 'text-blue-800' : 'text-slate-600'} whitespace-pre-wrap`}>{renderContentWithLinks(r.content)}</div>
							</div>
						);
					});
				};

				// ★ 計算目前顯示的身分 UI
				const renderIdentityInput = () => {
					if (isTeacherMode) {
						return <div className="px-2 flex items-center justify-center bg-blue-500 text-white text-xs font-bold rounded-md flex-shrink-0 shadow-sm">導師</div>;
					}

					const lockedIdentity = getLockedStudentIdentity();

					if (lockedIdentity) {
						// 已有紀錄：顯示固定標籤
						return (
							<div className="px-2 flex items-center justify-center bg-purple-100 text-purple-700 border border-purple-200 text-xs font-bold rounded-md flex-shrink-0 shadow-sm" title="此任務已鎖定負責幹部">
								{lockedIdentity}
							</div>
						);
					} else {
						// 無紀錄：顯示輸入框
						return (
							<input 
								placeholder="輸入職稱" 
								className="w-20 p-1.5 text-xs border border-purple-200 rounded-md focus:ring-2 focus:ring-purple-200 outline-none bg-white text-center font-bold text-purple-700 placeholder-purple-300" 
								value={tempCadreName} 
								onChange={e => setTempCadreName(e.target.value)} 
							/>
						);
					}
				};

				return (
					<div id="cadre-section" className="flex-1 h-full flex flex-col relative bg-purple-50/50 rounded-2xl border-2 border-purple-100 shadow-inner p-4 md:p-6 overflow-hidden">
						
						<div className="mb-4 flex items-center justify-between gap-2 pb-2 border-b border-purple-200 flex-shrink-0">
							<div className="flex items-center gap-2">
								<ClipboardCheck className="w-5 h-5 text-purple-600" />
								<h2 className="text-lg font-bold text-purple-800">交辦幹部事項</h2>
							</div>
							{isTeacherMode && (
								<button onClick={() => handleOpenModal(null)} className="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm font-bold transition-all shadow-sm flex items-center gap-1 active:scale-95">
									<Plus className="w-4 h-4" /> <span>新增任務</span>
								</button>
							)}
						</div>

						{tasks.length === 0 ? (
							<div className="flex-1 flex flex-col items-center justify-center text-center text-purple-300">
								<p className="font-bold text-purple-200">目前沒有交辦事項</p>
							</div>
						) : (
							<div className="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-1 pb-20">
								{tasks.map(task => {
									const status = STATUS_MAP[task.status] || STATUS_MAP.pending;
									const isOverdue = task.status !== 'done' && task.deadline < getTodayStr();
									const isExpanded = expandedTaskIds.has(task.id);

									return (
										<div key={task.id} className={`bg-white rounded-xl shadow-sm border transition-all hover:shadow-md group relative overflow-hidden flex items-stretch ${isOverdue ? 'border-rose-300' : 'border-purple-100 hover:border-purple-300'}`}>
											
											<div className={`flex-1 p-4 flex flex-col gap-3 min-w-0 ${isOverdue ? 'pt-8 md:pt-4' : ''}`}>
												<div className="flex flex-col md:flex-row md:items-center gap-3">
													{isOverdue && <div className="absolute top-0 left-0 bg-rose-500 text-white text-xs font-bold px-3 py-1 rounded-br-lg z-10">已逾期</div>}
													
													<div className="flex items-center gap-2">
														<div className={`flex-shrink-0 px-2.5 py-1 rounded-full text-xs font-bold border text-center min-w-[70px] ${status.color}`}>{status.label}</div>
														{task.targetCadre && (
															<div className="md:hidden inline-block px-2 py-0.5 bg-purple-100 text-purple-700 text-xs font-bold rounded border border-purple-200">
																@{task.targetCadre}
															</div>
														)}
													</div>

													<div className="flex-1 min-w-0">
														<div className="flex items-center gap-2 mb-1">
															{task.targetCadre && (
																<span className="hidden md:inline-block px-2 py-0.5 bg-purple-100 text-purple-700 text-xs font-bold rounded border border-purple-200 flex-shrink-0">
																	@{task.targetCadre}
																</span>
															)}
															<h3 className="font-bold text-slate-800 text-base truncate">{task.title}</h3>
														</div>
														<div className="flex items-center gap-3 text-xs text-slate-400 font-bold">
															<span className={`flex items-center gap-1 ${isOverdue ? 'text-rose-500' : ''}`}><CalendarIcon className="w-3.5 h-3.5"/> {task.deadline}</span>
															<div className="flex items-center gap-1 bg-slate-50 px-1.5 py-0.5 rounded border border-slate-100">
																<MessageSquare className="w-3 h-3"/> 
																<span>{task.reports?.length || 0} 則</span>
																<button onClick={() => toggleTaskExpand(task.id)} className="ml-1 p-0.5 hover:bg-slate-200 rounded text-purple-500 transition-colors">
																	{isExpanded ? <Minus className="w-3 h-3"/> : <Plus className="w-3 h-3"/>}
																</button>
															</div>
														</div>
													</div>
												</div>

												{/* 卡片展開回報 */}
												{isExpanded && (
													<div className="mt-2 bg-purple-50/50 rounded-lg p-3 border border-purple-100 animate-fade-in">
														<h4 className="text-xs font-bold text-purple-400 mb-2 uppercase tracking-wider">回報紀錄</h4>
														<div className="space-y-2 max-h-48 overflow-y-auto custom-scrollbar pr-1">
															{renderReports(task.reports)}
														</div>
													</div>
												)}
											</div>

											<div className="flex flex-col border-l border-purple-50 w-12 flex-shrink-0">
												{isTeacherMode ? (
													<>
														<button onClick={() => handleOpenModal(task)} className="flex-1 flex items-center justify-center hover:bg-blue-50 text-slate-300 hover:text-blue-500 transition-colors border-b border-purple-50"><Edit3 className="w-5 h-5"/></button>
														<button onClick={() => handleRequestDelete(null, task)} className="flex-1 flex items-center justify-center hover:bg-rose-50 text-slate-300 hover:text-rose-500 transition-colors"><Trash2 className="w-5 h-5"/></button>
													</>
												) : (
													<button onClick={() => handleOpenModal(task)} className="flex-1 flex items-center justify-center hover:bg-purple-100 text-slate-300 hover:text-purple-600 transition-colors" title="新增回報"><History className="w-5 h-5"/></button>
												)}
											</div>
										</div>
									);
								})}
							</div>
						)}

						{/* Modal - 編輯/回報任務 */}
						<Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title={currentTask ? (isTeacherMode ? "編輯任務" : "狀態回報") : "新增任務"} 
							footer={
								<div className="flex justify-between w-full">
										{isTeacherMode && currentTask ? (
											<button onClick={() => handleRequestDelete(null, currentTask)} className="text-rose-500 hover:bg-rose-50 px-3 py-1.5 rounded-lg font-bold text-xs transition-colors flex items-center gap-1"><Trash2 className="w-4 h-4"/> 刪除</button>
										) : <div></div>}
										{isTeacherMode && <button onClick={handleSaveTask} className="bg-purple-600 text-white px-5 py-1.5 rounded-lg font-bold shadow-md hover:bg-purple-700 text-sm">儲存</button>}
								</div>
							}
						>
							<div className="space-y-3 text-slate-700 -mt-4">
								{/* 1. 任務資訊區 - 僅老師模式顯示 */}
								{isTeacherMode && (
									<div className="bg-purple-50/50 p-3 rounded-xl border border-purple-100 flex flex-col gap-2">
										<div>
											<label className="block text-xs font-bold text-purple-600 uppercase tracking-wider">任務內容</label>
											<input value={editTitle} onChange={e => setEditTitle(e.target.value)} className="w-full mt-1 p-2 text-sm border border-purple-200 rounded-lg font-bold focus:ring-2 focus:ring-purple-400 outline-none" placeholder="輸入任務..."/>
										</div>
										
										<div className="grid grid-cols-2 gap-2 pt-2 border-t border-purple-100">
											<div>
												<label className="block text-xs font-bold text-purple-600 uppercase">截止日期</label>
												<input type="date" value={editDeadline} onChange={e => setEditDeadline(e.target.value)} className="w-full mt-1 p-1.5 text-xs border border-purple-200 rounded-md font-bold outline-none text-slate-600"/>
											</div>
											<div>
												<label className="block text-xs font-bold text-purple-600 uppercase">指定對象</label>
												<div className="flex gap-1 mt-1">
													<select 
														value={isCustomTargetMode ? "__OTHER__" : editTargetCadre} 
														onChange={handleSelectChange} 
														className="w-full p-1.5 text-xs border border-purple-200 rounded-md font-bold outline-none text-slate-600 bg-white"
													>
														<option value="">全體幹部</option>
														{CADRE_ROLES.map(role => (
															<option key={role} value={role}>{role}</option>
														))}
														<option value="__OTHER__">其他 (自行輸入)</option>
													</select>
												</div>
												{isCustomTargetMode && (
													<input 
														type="text" 
														value={editTargetCadre} 
														onChange={e => setEditTargetCadre(e.target.value)}
														placeholder="輸入座號或職稱..."
														className="w-full mt-1 p-1.5 text-xs border border-purple-300 rounded-md bg-white focus:ring-2 focus:ring-purple-200 outline-none animate-fade-in"
													/>
												)}
											</div>
										</div>
									</div>
								)}

								{/* 2. 狀態切換 */}
								{currentTask && (
									<div>
										<label className="block text-base font-bold text-purple-600 mb-1.5 px-1 uppercase tracking-widest">變更目前狀態</label>
										<div className="grid grid-cols-4 gap-2">
											{Object.entries(STATUS_MAP).map(([key, conf]) => (
												<button key={key} onClick={() => { setEditStatus(key); if(currentTask) db.collection('cadre_tasks').doc(currentTask.id).update({status: key}); }}
														className={`py-2 rounded-lg text-sm font-bold border transition-all flex flex-col items-center justify-center ${editStatus === key ? `${conf.color} shadow-sm ring-1 ring-slate-200` : 'bg-white text-slate-400 border-slate-100'}`}>
													{conf.label}
												</button>
											))}
										</div>
									</div>
								)}

								{/* 3. 回報區 */}
								{currentTask && (
									<div className="border-t border-slate-100 pt-3">
										<div className="flex items-center justify-between mb-2 px-1">
											<h4 className="text-base font-bold text-purple-600 flex items-center gap-1"><History className="w-4 h-4 text-purple-500"/> 回報紀錄</h4>
											<span className="text-xs text-slate-400 font-bold">{currentTask.reports?.length || 0} 則</span>
										</div>
										
										<div className="bg-slate-50/50 rounded-lg p-2 max-h-48 overflow-y-auto mb-2 space-y-1.5 border border-slate-100 custom-scrollbar">
											{renderReports(currentTask.reports)}
										</div>
										
										<div className="flex gap-1.5 bg-slate-100 p-1 rounded-lg">
											{/* ★ 自動判斷顯示：輸入框 OR 固定身分標籤 */}
											{renderIdentityInput()}
											
											<input placeholder={isTeacherMode ? "導師回覆..." : "快速回報..."} className="flex-1 p-1.5 text-xs bg-transparent border-none focus:ring-0 outline-none" value={reportContent} onChange={e => setReportContent(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleAddReport()} />
											<button onClick={handleAddReport} className={`text-white px-3 py-1.5 rounded-md text-xs font-bold flex-shrink-0 ${isTeacherMode ? 'bg-blue-600 hover:bg-blue-700' : 'bg-purple-600 hover:bg-purple-700'}`}>送出</button>
										</div>
									</div>
								)}
							</div>
						</Modal>
						
						{/* 刪除確認 Modal */}
						<Modal isOpen={isDeleteModalOpen} onClose={() => setIsDeleteModalOpen(false)} 
							title="確認刪除任務"
							footer={
								<div className="flex justify-end gap-2 w-full">
									<button onClick={() => setIsDeleteModalOpen(false)} className="px-4 py-2 text-slate-500 font-bold hover:bg-slate-100 rounded-lg">取消</button>
									<button onClick={handleConfirmDelete} className="px-6 py-2 bg-rose-500 text-white font-bold rounded-lg shadow-md hover:bg-rose-600 transition-all">確定刪除</button>
								</div>
							}
						>
							<div className="flex flex-col items-center text-center p-4">
								<div className="bg-rose-50 p-4 rounded-full mb-4">
									<Trash2 className="w-10 h-10 text-rose-500" />
								</div>
								<h4 className="text-lg font-bold text-slate-800 mb-2">確定要刪除這項任務嗎？</h4>
								<div className="bg-slate-50 p-3 rounded-lg border border-slate-100 w-full mb-2">
									<p className="text-sm text-slate-600 font-bold">「{taskToDelete?.title}」</p>
								</div>
								<p className="text-xs text-rose-400 font-bold">※ 刪除後所有回報紀錄也會一起消失且無法復原</p>
							</div>
						</Modal>

						{/* ★ 警告訊息 Modal (取代 alert) */}
						<Modal isOpen={alertConfig.isOpen} onClose={() => setAlertConfig({ ...alertConfig, isOpen: false })} 
							title="提示"
							footer={<button onClick={() => setAlertConfig({ ...alertConfig, isOpen: false })} className="w-full py-2 bg-slate-800 text-white rounded-lg font-bold">知道了</button>}
						>
							<div className="p-4 text-center">
								<p className="text-slate-700 font-bold text-lg">{alertConfig.message}</p>
							</div>
						</Modal>
												
					</div>
				);
			};
		const PresentationView = ({ selectedDate, groupedEntries, setIsPresenting, formatDateWithWeek, getSubjectColor, getTypeLabelStyle }) => (

        function ClassPlanner() {
			const getTodayString = () => {
					const now = new Date();
					const offset = now.getTimezoneOffset();
					const localDate = new Date(now.getTime() - (offset * 60 * 1000));
					return localDate.toISOString().split('T')[0];
				};
            const [viewMode, setViewMode] = useState('planner'); // 'planner' | 'bulletin' | 'resources'
            const [entries, setEntries] = useState([]);
			const [cadreTasks, setCadreTasks] = React.useState([]);
			// 1. 新增：偵測是否有進行中的幹部任務
			const [hasActiveCadreTasks, setHasActiveCadreTasks] = useState(false);

			// 2. 新增：監聽資料庫 (只監聽是否有 'pending', 'processing', 'stuck' 的任務)
			useEffect(() => {
				if (!db) return;
				const unsubscribe = db.collection('cadre_tasks')
					.where('status', 'in', ['pending', 'processing', 'stuck']) // 只找未完成的
					.onSnapshot(snapshot => {
						setHasActiveCadreTasks(!snapshot.empty); // 如果不為空，代表有任務
					});
				return () => unsubscribe();
			}, [db]);

			// 新增：在 ClassPlanner 裡監聽交辦任務資料
			useEffect(() => {
				if (!db) return;
				// 這裡的邏輯跟原本 CadreTaskSection 裡的一模一樣
				const unsubscribe = db.collection('cadre_tasks').orderBy('createdAt', 'desc')
					.onSnapshot(snapshot => {
						const newTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
						setCadreTasks(newTasks);
					});
				return () => unsubscribe();
			}, []);


			const handleFullExport = () => {
				// 準備要打包的所有資料
				const allData = {
					entries: entries,           // 聯絡簿
					announcements: announcements, // 公告
					resources: resources,       // 資源連結
					tasks: cadreTasks           // ★ 確保有這行，這是交辦事項
				};

				// 轉成 JSON 字串
				const dataStr = JSON.stringify(allData);
				const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);

				const exportFileDefaultName = `聯絡簿備份_${new Date().toISOString().split('T')[0]}.json`;
				const linkElement = document.createElement('a');
				linkElement.setAttribute('href', dataUri);
				linkElement.setAttribute('download', exportFileDefaultName);
				linkElement.click();

			// 管理已完成的事項 ID
            const [completedIds, setCompletedIds] = useState(() => {

            useEffect(() => {

            }, [completedIds]);

            // 切換完成狀態的函數
            const toggleComplete = (id) => {
                setCompletedIds(prev => 
                    prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]
                );
            };	
            const [announcements, setAnnouncements] = useState([]);
            const [resources, setResources] = useState([]); // 新增資源區資料
            const [appTitle, setAppTitle] = useState('戊班數位多元系統');
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('classPlannerSettings_v3'); 
                return saved ? JSON.parse(saved) : { passwordEnabled: true, teacherPassword: "1234" };
            });

            const [mode, setMode] = useState('student'); 
            const todayStr = getTodayString();
            const [selectedDate, setSelectedDate] = useState(todayStr);
			const [searchQuery, setSearchQuery] = useState('');
            
            const [isCloudMode, setIsCloudMode] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            const [isNarrow, setIsNarrow] = useState(window.innerWidth < 1024);
            const [showCalendarModal, setShowCalendarModal] = useState(false);

            useEffect(() => {
