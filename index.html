                window.addEventListener('resize', check);
                return () => window.removeEventListener('resize', check);
            }, []);

            const [isFormOpen, setIsFormOpen] = useState(false);
            const [isBulletinFormOpen, setIsBulletinFormOpen] = useState(false);
            const [isResourceFormOpen, setIsResourceFormOpen] = useState(false); // Resource Form

            const [isDeleteAlertOpen, setIsDeleteAlertOpen] = useState(false);
            const [isDeleteAnnouncementModalOpen, setIsDeleteAnnouncementModalOpen] = useState(false);
            const [announcementToDelete, setAnnouncementToDelete] = useState(null);
            const [resourceToDelete, setResourceToDelete] = useState(null); // Resource delete
            const [isDeleteResourceModalOpen, setIsDeleteResourceModalOpen] = useState(false);

            const [isPasswordModalOpen, setIsPasswordModalOpen] = useState(false);
            const [isImportModalOpen, setIsImportModalOpen] = useState(false); 
            const [pendingImportData, setPendingImportData] = useState(null); 
            const [isPresenting, setIsPresenting] = useState(false);
            const [isSavePromptOpen, setIsSavePromptOpen] = useState(false);
            const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
            const [isImportPreviousConfirmOpen, setIsImportPreviousConfirmOpen] = useState(false);
            const [importPreviousData, setImportPreviousData] = useState(null);
            const [generalAlert, setGeneralAlert] = useState({ isOpen: false, title: '', message: '' });
            const [isRemoveDupConfirmOpen, setIsRemoveDupConfirmOpen] = useState(false);

            const [isAlertModalOpen, setIsAlertModalOpen] = useState(false);
			const [alertModalMessage, setAlertModalMessage] = useState("");
			
			const [passwordInput, setPasswordInput] = useState('');
            const [passwordError, setPasswordError] = useState(false);
            const [groupToDelete, setGroupToDelete] = useState(null); 
            const [isEditingTitle, setIsEditingTitle] = useState(false);
            const fileInputRef = useRef(null);
            const unsubscribeRef = useRef(null);
            const unsubscribeAnnounceRef = useRef(null);
            const unsubscribeResourceRef = useRef(null);

            const [formMode, setFormMode] = useState('add'); 
            const [formDate, setFormDate] = useState(getTodayString());
			const [formSubject, setFormSubject] = useState('英文');
            const [formItems, setFormItems] = useState([]);

            const [bulletinForm, setBulletinForm] = useState({ id: null, content: '', deadline: '', details: '' });
            const [expandedBulletinIds, setExpandedBulletinIds] = useState([]);

            // Resource Form Data
            const [resourceForm, setResourceForm] = useState({ id: null, title: '', url: '', description: '' });
            
            // Drag and Drop State
            const dragItem = useRef();
            const dragOverItem = useRef();

            const [newPassword, setNewPassword] = useState("");
            const [confirmPassword, setConfirmPassword] = useState("");

            useEffect(() => {
                localStorage.setItem('classPlannerSettings_v3', JSON.stringify(settings));
            }, [settings]);

            const showAlert = (title, message) => setGeneralAlert({ isOpen: true, title, message });

            useEffect(() => {
                if (!window.auth || !window.db) {
                    setIsLoading(false);
                    return;
                }

                const unregisterAuthObserver = window.auth.onAuthStateChanged((user) => {
                    if (user) {
                        setIsCloudMode(true);
                        // Listener for Contact Book
                        const colRef = window.db.collection('artifacts').doc('class_planner_v1').collection('public').doc('data').collection('entries');
                        unsubscribeRef.current = colRef.onSnapshot((snapshot) => {
                            const cloudData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setEntries(cloudData);
                            setIsLoading(false);
                        }, (error) => setIsLoading(false));

                        // Listener for Announcements
                        const annRef = window.db.collection('artifacts').doc('class_planner_v1').collection('public').doc('data').collection('announcements');
                        unsubscribeAnnounceRef.current = annRef.onSnapshot((snapshot) => {
                             const cloudData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                             setAnnouncements(cloudData);
                        });

                        // Listener for Resources (Sorted by order)
                        const resRef = window.db.collection('artifacts').doc('class_planner_v1').collection('public').doc('data').collection('resources');
                        unsubscribeResourceRef.current = resRef.orderBy('order', 'asc').onSnapshot((snapshot) => {
                            const cloudData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setResources(cloudData);
                        });

                    } else {
                        window.auth.signInAnonymously().catch(() => setIsLoading(false));
                    }
                });

                return () => {
                    unregisterAuthObserver();
                    if (unsubscribeRef.current) unsubscribeRef.current();
                    if (unsubscribeAnnounceRef.current) unsubscribeAnnounceRef.current();
                    if (unsubscribeResourceRef.current) unsubscribeResourceRef.current();
                };
            }, []);

            // Logic Sections
            const filteredEntries = useMemo(() => {
                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    return entries.filter(e => e.content.toLowerCase().includes(q) || e.subject.includes(q) || (e.date && e.date.includes(q)));
                }
                return entries.filter(e => e.date === selectedDate).sort((a,b) => {
                    // 1. 置頂判斷 (有置頂的排前面)
                    const pinA = a.isPinned ? 1 : 0;
                    const pinB = b.isPinned ? 1 : 0;
                    if (pinA !== pinB) return pinB - pinA;
                    
                    // 2. 原本的科目與類型排序
                    return (getSubjectOrder(a.subject) - getSubjectOrder(b.subject)) || (TYPE_PRIORITY[a.type] - TYPE_PRIORITY[b.type]);
                });
            }, [entries, selectedDate, searchQuery]);

            const groupedEntries = useMemo(() => {
                const groups = {};
                filteredEntries.forEach(e => {
                    if (!groups[e.subject]) groups[e.subject] = [];
                    groups[e.subject].push(e);
                });
                return groups;
            }, [filteredEntries]);

            const availableDatesMap = useMemo(() => {
                const map = new Set();
                entries.forEach(e => map.add(e.date));
                return map;
            }, [entries]);

            const sortedAnnouncements = useMemo(() => {
                return [...announcements].sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
            }, [announcements]);

            const toggleBulletinExpand = (id) => {
                setExpandedBulletinIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
            };

            const saveToCloud = async (action, data, collectionName = 'entries') => {
                if (!isCloudMode || !window.db) return; // Basic local mock removed for brevity, cloud focus
                
                const colRef = window.db.collection('artifacts').doc('class_planner_v1').collection('public').doc('data').collection(collectionName);
                
                try {
                    const batch = window.db.batch();
                    
                    if (collectionName === 'entries') {
                         const processItem = (item, ref) => {
                            const docData = { ...item };
                            if (docData.deadline === undefined) docData.deadline = null;
                            if (docData.repeat === undefined) docData.repeat = null;
                            if (docData.id) delete docData.id;
                            batch.set(ref, { ...docData, timestamp: Date.now() });
                        };
                        if (action === 'batch_add') data.forEach(item => processItem(item, colRef.doc()));
                        else if (action === 'batch_replace') {
                            data.idsToDelete.forEach(id => batch.delete(colRef.doc(id)));
                            data.newItems.forEach(item => processItem(item, colRef.doc()));
                        } else if (action === 'batch_delete') data.ids.forEach(id => batch.delete(colRef.doc(id)));

                    } else if (collectionName === 'announcements') {
                        if (action === 'add') {
                            const ref = colRef.doc();
                            const docData = { ...data, timestamp: Date.now() };
                            delete docData.id;
                            batch.set(ref, docData);
                        } else if (action === 'update') {
                            const ref = colRef.doc(data.id);
                            const docData = { ...data };
                            delete docData.id;
                            batch.update(ref, docData);
                        } else if (action === 'delete') batch.delete(colRef.doc(data.id));

                    } else if (collectionName === 'resources') {
                        if (action === 'add') {
                            const ref = colRef.doc();
                            // Find max order
                            const maxOrder = resources.length > 0 ? Math.max(...resources.map(r => r.order || 0)) : -1;
                            const docData = { ...data, order: maxOrder + 1, timestamp: Date.now() };
                            delete docData.id;
                            batch.set(ref, docData);
                        } else if (action === 'update') {
                            const ref = colRef.doc(data.id);
                            const docData = { ...data };
                            delete docData.id;
                            batch.update(ref, docData);
                        } else if (action === 'delete') {
                            batch.delete(colRef.doc(data.id));
                        } else if (action === 'batch_update_order') {
                            // data is array of {id, order}
                            data.forEach(item => {
                                batch.update(colRef.doc(item.id), { order: item.order });
                            });
                        }
                    }

                    await batch.commit();
                } catch (e) {
                    showAlert("儲存失敗", e.message);
                }
            };

            // DnD Handlers
            const handleDragStart = (e, position) => {
                dragItem.current = position;
                // Add a ghost effect class if needed, but default is usually fine
            };

            const handleDragEnter = (e, position) => {
                dragOverItem.current = position;
            };

            const handleDragEnd = () => {
                if (dragItem.current === undefined || dragOverItem.current === undefined) return;
                
                const newResources = [...resources];
                const dragItemContent = newResources[dragItem.current];
                newResources.splice(dragItem.current, 1);
                newResources.splice(dragOverItem.current, 0, dragItemContent);
                
                dragItem.current = null;
                dragOverItem.current = null;
                
                // Optimistic UI update
                setResources(newResources);

                // Prepare batch update for Cloud
                const updates = newResources.map((item, index) => ({
                    id: item.id,
                    order: index
                }));
                saveToCloud('batch_update_order', updates, 'resources');
            };

            // --- Modal Openers ---
            const openAddModal = () => {
                setFormMode('add');
                setFormDate(selectedDate);
                setFormSubject('英文');
                setFormItems([{ id: Date.now(), type: 'homework', content: '', deadline: '', repeat: 'none' ,isPinned: false}]);
                setIsFormOpen(true);
            };

            const openGroupEditModal = (subject) => {
                setFormMode('edit-group');
                setFormDate(selectedDate);
                setFormSubject(subject);
                const items = entries.filter(e => e.date === selectedDate && e.subject === subject).map(e => ({ ...e }));
                setFormItems(items.length > 0 ? items : [{ id: Date.now(), type: 'homework', content: '', deadline: '', repeat: 'none' }]);
                setIsFormOpen(true);
            };

            const openBulletinModal = () => {
                const defaultDeadline = new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0];
                setBulletinForm({ id: null, content: '', deadline: defaultDeadline, details: '' });
                setIsBulletinFormOpen(true);
            };

            const handleEditAnnouncement = (e, item) => {
                e.stopPropagation(); 
                setBulletinForm({ id: item.id, content: item.content, deadline: item.deadline, details: item.details });
                setIsBulletinFormOpen(true);
            };

            // Resource Operations
            const openResourceModal = () => {
                setResourceForm({ id: null, title: '', url: '', description: '' });
                setIsResourceFormOpen(true);
            };
            const handleEditResource = (item) => {
                setResourceForm({ id: item.id, title: item.title, url: item.url, description: item.description });
                setIsResourceFormOpen(true);
            };
            const handleResourceSubmit = () => {
                if (!resourceForm.title) return;
                const data = { id: resourceForm.id, title: resourceForm.title, url: resourceForm.url, description: resourceForm.description };
                const action = resourceForm.id ? 'update' : 'add';
                saveToCloud(action, data, 'resources');
                setIsResourceFormOpen(false);
            };
            const handleDeleteResource = (id) => {
                setResourceToDelete(id);
                setIsDeleteResourceModalOpen(true);
            };
            const confirmDeleteResource = () => {
                if(resourceToDelete) {
                    saveToCloud('delete', {id: resourceToDelete}, 'resources');
                    setResourceToDelete(null);
                    setIsDeleteResourceModalOpen(false);
                }
            };

            const handleBulletinSubmit = () => {
                if (!bulletinForm.content) return;
                const data = { id: bulletinForm.id, content: bulletinForm.content, deadline: bulletinForm.deadline, details: bulletinForm.details || '' };
                const action = bulletinForm.id ? 'update' : 'add';
                saveToCloud(action, data, 'announcements');
                setIsBulletinFormOpen(false);
            };

            const handleDeleteAnnouncement = (e, id) => {
                e.stopPropagation(); 
                setAnnouncementToDelete(id);
                setIsDeleteAnnouncementModalOpen(true);
            };

            const confirmDeleteAnnouncement = () => {
                if(announcementToDelete) {
                    saveToCloud('delete', {id: announcementToDelete}, 'announcements');
                    setAnnouncementToDelete(null);
                    setIsDeleteAnnouncementModalOpen(false);
                }
            };

            const addFormItemRow = () => setFormItems([...formItems, { id: Date.now(), type: 'homework', content: '', deadline: '', repeat: 'none', isPinned: false }]);
			const removeFormItemRow = (id) => setFormItems(formItems.filter(i => i.id !== id));
            const updateFormItem = (id, f, v) => setFormItems(formItems.map(i => i.id === id ? { ...i, [f]: v } : i));

            const handleSubmit = () => {
                const validItems = formItems.filter(i => i.content.trim() !== '');
                const itemsToProcess = validItems.map(item => ({
                    id: item.id,
                    date: formDate,
                    subject: formSubject,
                    type: item.type,
                    content: item.content,
                    deadline: item.deadline || undefined,
                    repeat: item.repeat === 'none' ? undefined : item.repeat,
					isPinned: item.isPinned || false
                }));

                if (formMode === 'edit-group') {
                    const originalIds = entries.filter(e => e.date === formDate && e.subject === formSubject).map(e => e.id);
                    saveToCloud('batch_replace', { idsToDelete: originalIds, newItems: itemsToProcess }, 'entries');
                } else {
                    saveToCloud('batch_add', itemsToProcess, 'entries');
                }
                setIsFormOpen(false);
            };

            const handleModeSwitch = () => { if(mode==='student'){ if(settings.passwordEnabled){ setPasswordInput(''); setPasswordError(false); setIsPasswordModalOpen(true); } else setMode('teacher'); } else setMode('student'); };
            const checkPassword = () => { if(passwordInput === settings.teacherPassword){ setMode('teacher'); setIsPasswordModalOpen(false); } else setPasswordError(true); };
            const confirmDeleteGroup = (subject) => {
                const idsToDelete = entries.filter(e => e.date === selectedDate && e.subject === subject).map(e => e.id);
                setGroupToDelete({ subject, ids: idsToDelete }); 
                setIsDeleteAlertOpen(true);
            };
            const executeDeleteGroup = () => { if(groupToDelete) { saveToCloud('batch_replace', { idsToDelete: groupToDelete.ids, newItems: [] }, 'entries'); setGroupToDelete(null); setIsDeleteAlertOpen(false); }};

            const renderCalendarGrid = (monthStr) => {
                const [y, m] = monthStr.split('-').map(Number);
                const firstDay = new Date(y, m - 1, 1).getDay(); 
                const daysInMonth = new Date(y, m, 0).getDate();
                const cells = []; for(let i=0; i<firstDay; i++) cells.push(null); for(let i=1; i<=daysInMonth; i++) cells.push(i);
                return cells;
            };

            const handleImportClick = () => fileInputRef.current.click();
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        if (importedData.entries) { setPendingImportData(importedData); setIsImportModalOpen(true); }
                    } catch (err) { showAlert("匯入失敗", "檔案錯誤"); }
                    e.target.value = '';
                };
                reader.readAsText(file);
            };
            const confirmImport = () => { if(pendingImportData){ saveToCloud('batch_add', pendingImportData.entries, 'entries'); if(pendingImportData.appTitle)setAppTitle(pendingImportData.appTitle); setIsImportModalOpen(false); setPendingImportData(null); }};
            const handleExport = () => {
                const dataStr = JSON.stringify({ entries, appTitle, timestamp: new Date().toISOString() });
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `聯絡簿備份_${new Date().toISOString().split('T')[0]}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            };
            const handleImportPrevious = () => {
                const previousDates = Array.from(new Set(entries.map(e => e.date))).filter(d => d < selectedDate).sort((a,b)=>new Date(b)-new Date(a));
                if(previousDates.length===0){ showAlert("提示", "無前次資料"); return; }
                const targetDate = previousDates[0];
                const sourceEntries = entries.filter(e => e.date === targetDate);
                setImportPreviousData({ date: targetDate, items: sourceEntries });
                setIsImportPreviousConfirmOpen(true);
            };
            const confirmImportPrevious = () => {
				if (importPreviousData) {
					// 1. 取得目前目標日期 (今天) 已有的資料，用來比對重複
					const currentTargetEntries = entries.filter(e => e.date === selectedDate);

					// 2. 篩選出真正需要匯入的資料
					const validItems = importPreviousData.items.filter(e => {
						// --- A. 過期檢查 ---
						// 如果事項有截止日，而且「今天」已經超過「截止日」，就過濾掉 (不匯入)
						// 字串比較: "2024-02-05" > "2024-02-04" 會是 true
						if (e.deadline && selectedDate > e.deadline) {
							return false;
						}

						// --- B. 重複檢查 (防止按兩次) ---
						// 檢查今天是不是已經有一樣的科目和內容
						const isDuplicate = currentTargetEntries.some(existing => 
							existing.subject === e.subject && 
							existing.content === e.content
						);
						
						if (isDuplicate) {
							return false; // 已經有了，跳過
						}

						return true; // 通過檢查，這個要！
					});

					// 3. 如果篩選完發現沒東西 (可能都過期或重複了)
					if (validItems.length === 0) {
						setAlertModalMessage("沒有需要匯入的新資料 (可能項目都已過期，或今天已有相同內容囉！)");
						setIsAlertModalOpen(true); // 開啟提示 Modal
						
						setIsImportPreviousConfirmOpen(false); // 關閉原本的詢問 Modal
						setImportPreviousData(null);
						return;
					}

					// 4. 準備寫入資料
					const newItems = validItems.map(e => ({ 
						date: selectedDate, 
						subject: e.subject, 
						type: e.type, 
						content: e.content, 
						deadline: e.deadline, 
						repeat: e.repeat 
					}));

					// 5. 執行儲存
					saveToCloud('batch_add', newItems, 'entries'); 
					
					// 成功後的收尾
					setIsImportPreviousConfirmOpen(false); 
					setImportPreviousData(null);
				}
			};
            const onRemoveDuplicatesClick = () => setIsRemoveDupConfirmOpen(true);
            const executeRemoveDuplicates = () => {
                const uniqueSet = new Set(); const idsToDelete = [];
                entries.forEach(e => { const sig = `${e.date}|${e.subject}|${e.type}|${e.content}`; if(uniqueSet.has(sig)) idsToDelete.push(e.id); else uniqueSet.add(sig); });
                if(idsToDelete.length===0) showAlert("提示", "無重複資料"); else { saveToCloud('batch_delete', {ids: idsToDelete}, 'entries'); showAlert("完成", `已移除 ${idsToDelete.length} 筆`); }
                setIsRemoveDupConfirmOpen(false);
            };
            const handleSaveSettings = () => {
                if(newPassword && newPassword !== confirmPassword) { showAlert("錯誤", "密碼不符"); return; }
                setSettings({ ...settings, teacherPassword: newPassword || settings.teacherPassword });
                setNewPassword(""); setConfirmPassword(""); setIsSettingsModalOpen(false); showAlert("成功", "設定已儲存");
            };

            return (
                <div className="h-full flex flex-col bg-white">
                    <input type="file" ref={fileInputRef} onChange={handleFileChange} accept=".json" className="hidden" />
                    {isPresenting && <PresentationView selectedDate={selectedDate} groupedEntries={groupedEntries} setIsPresenting={setIsPresenting} formatDateWithWeek={formatDateWithWeek} getSubjectColor={getSubjectColor} getTypeLabelStyle={getTypeLabelStyle} />}
						<header className="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-20">
							<div className="max-w-7xl mx-auto px-3 py-3 flex flex-col gap-3">

								{/* ===== Row 1：標題（所有尺寸） ===== */}
								<div className="flex justify-center">
									{isEditingTitle && viewMode === 'planner' ? (
										<div className="flex items-center">
											<input
												autoFocus
												type="text"
												value={appTitle}
												onChange={(e) => setAppTitle(e.target.value)}
												onBlur={() => setIsEditingTitle(false)}
												onKeyDown={(e) => e.key === 'Enter' && setIsEditingTitle(false)}
												className="border-b-2 border-blue-500 outline-none text-2xl font-black text-slate-800 w-48 bg-transparent"
											/>
											<button onClick={() => setIsEditingTitle(false)} className="ml-2 text-emerald-500">
												<Check className="w-5 h-5"/>
											</button>
										</div>
									) : (
										<h1
											/* 修改 1: 加入 relative, 移除 gap-2 (因為圖示改用絕對定位了) */
											className="text-2xl font-black text-slate-800 tracking-tight flex items-center relative group cursor-pointer"
											onClick={() => (mode === 'teacher' && viewMode === 'planner') && setIsEditingTitle(true)}
										>
											{appTitle}
											
											{/* 修改 2: 圖示改用絕對定位 (absolute)，掛在文字右邊 (left-full) 再推開一點 (ml-2) */}
											{(mode === 'teacher' && viewMode === 'planner') && (
												<div className="absolute left-full ml-2 top-1/2 -translate-y-1/2">
													<Edit3 className="w-4 h-4 text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity" />
												</div>
											)}
										</h1>
									)}
								</div>

								{/* ===== Row 2：主要操作列 ===== */}
								
								<div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">

									{/* 左：頁面切換 */}
									<div className="flex justify-center lg:justify-start">
										
										<div className="flex bg-slate-100 p-1 rounded-lg w-full lg:w-auto overflow-x-auto">
											{[
												{ id: 'planner', label: '聯絡簿', icon: ClipboardList, activeClass: 'bg-blue-600 text-white shadow-sm' },
												{ id: 'bulletin', label: '佈告欄', icon: Megaphone, activeClass: 'bg-orange-600 text-white shadow-sm' },
												{ id: 'resources', label: '資源區', icon: Grid, activeClass: 'bg-emerald-600 text-white shadow-sm' },
												{ id: 'cadre', label: '交辦事項', icon: ClipboardCheck, activeClass: 'bg-purple-600 text-white shadow-sm' }
											].map(tab => (
												<button
													key={tab.id}
													onClick={() => setViewMode(tab.id)}
													className={`
														flex-1 lg:flex-none
														relative flex flex-col md:flex-row items-center justify-center 
														py-2 md:py-1 px-1 md:px-4 rounded-md transition-all duration-200 
														gap-0.5 md:gap-1.5
														${viewMode === tab.id 
															? tab.activeClass
															: 'text-slate-500 hover:text-slate-700 hover:bg-white/50'}
													`}
												>
													{/* 圖標：手機版稍微大一點點方便點擊 */}
													<tab.icon className="w-5 h-5 md:w-4 md:h-4" />
													
													{/* 文字：手機版強制變小 (text-[10px])，電腦版正常 (md:text-base) */}
													<span className="text-sm md:text-base font-bold whitespace-nowrap">{tab.label}</span>
												</button>
											))}
										</div>
									</div>

									{/* 中：搜尋（僅桌機 + 聯絡簿） */}
									<div className="hidden lg:block flex-1 max-w-xs mx-auto">
										{viewMode === 'planner' && (
											<div className="relative">
												<Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
												<input
													type="text"
													placeholder="搜尋內容..."
													value={searchQuery}
													onChange={(e) => setSearchQuery(e.target.value)}
													className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium
															   focus:ring-2 focus:ring-blue-200 focus:border-blue-300 focus:bg-white"
												/>
											</div>
										)}
									</div>

									{/* 右：Teacher Actions + 模式切換 */}
									<div className="flex justify-center lg:justify-end items-center gap-2 flex-wrap">

										{/* Mobile / Tablet 日曆（只在聯絡簿） */}
										{isNarrow && viewMode === "planner" && (
										  <button
											onClick={() => setShowCalendarModal(true)}
											className="px-3 py-2 rounded-lg text-sm font-bold text-slate-600 bg-slate-50 hover:bg-slate-100 flex items-center gap-1 border border-slate-200 whitespace-nowrap h-9"
										  >
											<CalendarIcon className="w-4 h-4" />
											日曆
										  </button>
										)}
										{/* ===== Teacher Actions（完全依頁面） ===== */}
										{mode === 'teacher' && viewMode === 'planner' && (
											<>
                                                <button onClick={openAddModal} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold transition-all shadow-sm flex items-center gap-1 whitespace-nowrap h-9 active:scale-95">
                                                    <Plus className="w-4 h-4" /> <span>新增</span>
                                                </button>
                                                <button onClick={handleImportPrevious} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-bold transition-all shadow-sm flex items-center gap-1 whitespace-nowrap h-9 active:scale-95" title="匯入前筆">
                                                    <History className="w-4 h-4" /> <span>前筆</span>
                                                </button>
											</>
										)}

										{mode === 'teacher' && viewMode === 'bulletin' && (
                                            <button onClick={openBulletinModal} className="px-3 py-1.5 bg-orange-600 hover:bg-orange-700 text-white rounded-lg text-sm font-bold transition-all shadow-sm flex items-center gap-1 whitespace-nowrap h-9 active:scale-95">
                                                <Plus className="w-4 h-4" /> <span>發布公告</span>
                                            </button>
										)}

										{mode === 'teacher' && viewMode === 'resources' && (
                                            <button onClick={openResourceModal} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-bold transition-all shadow-sm flex items-center gap-1 whitespace-nowrap h-9 active:scale-95">
                                                <Plus className="w-4 h-4" /> <span>新增資源</span>
                                            </button>
										)}

										{/* 模式切換 */}
										<button
											onClick={handleModeSwitch}
											className={`px-4 py-1.5 rounded-lg text-sm font-bold border transition-all h-9
												${
													mode === 'teacher'
														? 'bg-gray-600 text-white border-gray-600  hover:bg-gray-800'
														: 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
												}`}
										>
											{mode === 'student' ? '導師登入' : '學生模式'}
										</button>

										{/* 設定 */}
										{mode === 'teacher' && (
											<button
												onClick={() => setIsSettingsModalOpen(true)}
												className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 border border-slate-200 h-9"
											>
												<Settings className="w-5 h-5 text-slate-600" />
											</button>
										)}
									</div>
								</div>
							</div>
						</header>



                    {/* Main Content Area */}
                    <main className="flex-1 max-w-7xl mx-auto px-4 py-4 w-full flex flex-col lg:flex-row gap-6 overflow-hidden">
                        
                        {/* --- PLANNER MODE --- */}
                        {viewMode === 'planner' && (
                            <>
                                {!searchQuery && !isNarrow && (
                                    <div className="w-[320px] flex-shrink-0 h-full overflow-hidden">
                                        <CalendarSidebar 
                                            selectedDate={selectedDate} 
                                            setSelectedDate={setSelectedDate} 
                                            todayStr={todayStr} 
                                            availableDatesMap={availableDatesMap} 
                                            renderCalendarGrid={renderCalendarGrid} 
                                            closeModal={() => setShowCalendarModal(false)}
                                        />
                                    </div>
                                )}

                                <div className="flex-1 min-w-0 h-full flex flex-col relative bg-white/50 rounded-2xl">
                                    {isLoading && isCloudMode && <div className="absolute inset-0 z-10 bg-white/80 flex flex-col items-center justify-center backdrop-blur-sm rounded-xl"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-2"></div></div>}
                                    <div className="mb-4 flex items-center gap-3 border-b border-slate-100 pb-3 flex-shrink-0">
                                        <h2 className="text-xl md:text-2xl font-black text-slate-800 flex items-center">{searchQuery ? `搜尋結果` : formatDateWithWeek(selectedDate)}</h2>
                                        <span className="text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full border border-blue-100 whitespace-nowrap">{filteredEntries.length} 件事項</span>
										{/* 1. 公告按鈕 (橘色) */}
										{announcements.length > 0 && (
											<button 
												onClick={() => setViewMode('bulletin')} 
												className="w-9 h-9 flex-shrink-0 bg-orange-600 hover:bg-orange-700 text-white rounded-full shadow-md transition-all active:scale-95 animate-pulse-subtle flex items-center justify-center"
												title="有新的公告"
											>
												<Megaphone className="w-5 h-5" />
											</button>
										)}

										{/* 2. 任務按鈕 (紫色) */}
										{hasActiveCadreTasks && (
											<button 
												onClick={() => setViewMode('cadre')}
												className="w-9 h-9 flex-shrink-0 bg-purple-600 text-white rounded-full shadow-md hover:bg-purple-700 transition-all active:scale-95 animate-pulse-subtle flex items-center justify-center"
												title="有待辦事項"
											>
												<ClipboardCheck className="w-5 h-5" />
											</button>
										)}                                       

										<div className="flex-1"></div>
										<button onClick={() => setIsSavePromptOpen(true)} className="hidden md:flex items-center gap-2 px-3 py-1.5 bg-slate-800 text-white rounded-lg font-bold hover:bg-slate-700 transition-all shadow-sm">
											<Maximize className="w-5 h-5" /> 
											<span>投影模式</span>
										</button>
                                    </div>
									
                                    {filteredEntries.length === 0 ? (
                                        <div className="text-center py-20 bg-slate-50/50 rounded-3xl border-2 border-dashed border-slate-200">
                                            <div className="bg-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm"><CheckSquare className="w-8 h-8 text-slate-300" /></div>
                                            <p className="text-slate-400 font-bold text-base">目前沒有任何事項</p>
                                        </div>
                                    ) : (
                                        <div className="overflow-y-auto custom-scrollbar pb-20 space-y-2 pr-1">
                                            {/* Vertical List View */}
                                            {Object.entries(groupedEntries).map(([subject, subEntries]) => (
                                                <div key={subject} className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden animate-fade-in flex relative group hover:shadow-md transition-shadow">
                                                    {mode === 'teacher' && (
                                                        <div className="absolute top-3 right-3 z-10 flex gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-all transform md:translate-x-2 group-hover:translate-x-0">
                                                            <button onClick={() => openGroupEditModal(subject)} className="p-2 bg-white/95 hover:bg-blue-50 text-blue-600 rounded-lg border border-slate-100 shadow-sm"><Edit3 className="w-4 h-4"/></button>
                                                            <button onClick={() => confirmDeleteGroup(subject)} className="p-2 bg-white/95 hover:bg-rose-50 text-rose-600 rounded-lg border border-slate-100 shadow-sm"><Trash2 className="w-4 h-4"/></button>
                                                        </div>
                                                    )}
                                                    <div className={`w-14 md:w-20 flex-shrink-0 flex items-center justify-center p-2 text-center ${getSubjectColor(subject)}`}><span className="text-lg md:text-xl font-black tracking-widest writing-vertical-rl md:writing-horizontal-tb opacity-90">{subject.substring(0,2)}</span></div>
                                                    <div className="flex-1 flex flex-col py-1">
														{subEntries.map((entry, idx) => {
                                                            const isLast = idx === subEntries.length - 1;
                                                            const isDone = completedIds.includes(entry.id); // 判斷是否完成

                                                            return (
                                                                <div 
                                                                    key={entry.id} 
                                                                    onClick={() => toggleComplete(entry.id)} // 點擊切換狀態
                                                                    className={`flex items-start py-2 px-3 md:px-4 gap-2 cursor-pointer transition-all duration-200 ${!isLast ? 'border-b border-slate-50' : ''} ${isDone ? 'bg-slate-50/50' : 'hover:bg-blue-50/30'}`}
                                                                >
                                                                    <div className="flex-shrink-0 w-6 pt-1">
                                                                        {/* 已完成顯示勾勾，未完成顯示數字 */}
                                                                        {isDone ? (
                                                                            <span className="w-5 h-5 flex items-center justify-center bg-emerald-500 text-white rounded-full transition-transform scale-110">
                                                                                <Check className="w-3.5 h-3.5" />
                                                                            </span>
                                                                        ) : (
                                                                            <span className="text-xs font-bold text-slate-400 bg-slate-100 rounded-full w-5 h-5 flex items-center justify-center">
                                                                                {idx + 1}
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                    <div className="flex-1 min-w-0">
                                                                        <div className="flex flex-wrap items-center gap-x-2 gap-y-1">
                                                                            {/* 置頂圖示 */}
                                                                            {entry.isPinned && <Pin className={`w-3.5 h-3.5 flex-shrink-0 ${isDone ? 'text-slate-300 fill-slate-300' : 'text-orange-500 fill-orange-500'}`} />}
                                                                            
                                                                            {/* 事項內容：完成時 text-slate-400 並加上 line-through */}
                                                                            <p className={`text-lg font-bold leading-tight break-words transition-all ${isDone ? 'text-slate-400 line-through decoration-slate-300' : 'text-slate-700'}`}>
                                                                                {renderContent(entry.content)}
                                                                            </p>
                                                                            
                                                                            {/* 類型標籤：完成時變灰色 */}
                                                                            <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-md border inline-flex items-center h-5 leading-none translate-y-[-1px] ${isDone ? 'bg-slate-100 text-slate-400 border-slate-200' : getTypeLabelStyle(entry.type)}`}>
                                                                                {TYPE_LABEL[entry.type]}
                                                                            </span>
                                                                        </div>
                                                                        {entry.deadline && (
                                                                            <p className={`text-xs font-medium mt-1 ${isDone ? 'text-slate-300' : 'text-slate-400'}`}>
                                                                                截止時間: {entry.deadline.replace(/-/g, '/')}
                                                                            </p>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}                                                       

                                                    </div>
                                                </div>

                                            ))}
                                        </div>
                                    )}
                                </div>
                            </>
                        )}

{/* --- BULLETIN BOARD MODE --- */}
                        {viewMode === 'bulletin' && (
                            <div className="flex-1 h-full flex flex-col relative bg-orange-50/50 rounded-2xl border-2 border-orange-100 shadow-inner p-4 md:p-6 overflow-hidden">
                                {isLoading && isCloudMode && <div className="absolute inset-0 z-10 bg-white/80 flex flex-col items-center justify-center backdrop-blur-sm rounded-xl"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-2"></div></div>}
                                
                                <div className="mb-4 flex items-center gap-2 pb-2 border-b border-orange-200">
                                    <Pin className="w-5 h-5 text-orange-500 transform -rotate-12" />
                                    <h2 className="text-lg font-bold text-orange-800">重要公告事項</h2>
                                </div>

                                {sortedAnnouncements.length === 0 ? (
                                    <div className="flex-1 flex flex-col items-center justify-center text-center text-orange-300">
                                        <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-3 shadow-sm"><Megaphone className="w-8 h-8 text-orange-200"/></div>
                                        <p className="font-bold">目前沒有公告</p>
                                    </div>
                                ) : (
                                    <div className="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-1">
                                        {sortedAnnouncements.map((item, index) => {
                                            const isExpanded = expandedBulletinIds.includes(item.id);
                                            const isUrgent = new Date(item.deadline) - new Date() < 3 * 86400000 && new Date(item.deadline) > new Date();
                                            
                                            return (
                                                /* 修改重點：加入 flex items-stretch 與 group */
                                                <div key={item.id} className={`bg-white rounded-xl shadow-sm border flex items-stretch overflow-hidden group ${isUrgent ? 'border-l-4 border-l-rose-400 border-t-orange-100 border-r-orange-100 border-b-orange-100' : 'border-orange-100'} transition-all hover:shadow-md`}>
                                                    
                                                    {/* 左側內容區 (flex-1) */}
                                                    <div className="flex-1 min-w-0 flex flex-col">
                                                        <div className="p-4 flex items-start gap-3">
                                                            <div className="flex-shrink-0 pt-1 text-orange-300 font-black text-lg w-6 text-center">{index + 1}</div>
                                                            <div className="flex-1 min-w-0">
                                                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-2">
                                                                    <div className="flex items-center gap-2">
                                                                        <h3 className="text-lg font-bold text-slate-800">{renderContent(item.content)}</h3>
                                                                        {/* 展開/收合按鈕移到標題旁 */}
                                                                        <button onClick={() => toggleBulletinExpand(item.id)} className={`p-1 rounded-full transition-colors ${isExpanded ? 'bg-orange-100 text-orange-600' : 'text-slate-400 hover:bg-slate-100'}`}>
                                                                            {isExpanded ? <Minus className="w-4 h-4"/> : <Plus className="w-4 h-4"/>}
                                                                        </button>
                                                                    </div>
                                                                    <div className="flex items-center gap-2 text-sm font-bold text-slate-500 whitespace-nowrap bg-slate-50 px-2 py-1 rounded-md border border-slate-100">
                                                                        <CalendarIcon className="w-3.5 h-3.5" />
                                                                        {item.deadline.replace(/-/g, '/')}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        
                                                        {isExpanded && (
                                                            <div className="px-4 pb-4 pl-12 md:pl-14 animate-fade-in">
                                                                <div className="p-3 bg-slate-50 rounded-lg border border-slate-100 text-slate-600 text-sm leading-relaxed whitespace-pre-wrap font-medium">
                                                                    {renderTextWithLinks(item.details)}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>

                                                    {/* 右側按鈕區 (與 Resources 一致的樣式) */}
                                                    {mode === 'teacher' && (
                                                        <div className="flex flex-col border-l border-orange-50">
                                                            <button onClick={(e) => handleEditAnnouncement(e, item)} className="flex-1 px-3 hover:bg-blue-50 text-slate-300 hover:text-blue-500 transition-colors border-b border-orange-50 flex items-center justify-center" title="編輯">
                                                                <Edit3 className="w-5 h-5"/>
                                                            </button>
                                                            <button onClick={(e) => handleDeleteAnnouncement(e, item.id)} className="flex-1 px-3 hover:bg-rose-50 text-slate-300 hover:text-rose-500 transition-colors flex items-center justify-center" title="刪除">
                                                                <Trash2 className="w-5 h-5"/>
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* --- RESOURCE AREA MODE --- */}
                        {viewMode === 'resources' && (
                            <div className="flex-1 h-full flex flex-col relative bg-emerald-50/50 rounded-2xl border-2 border-emerald-100 shadow-inner p-4 md:p-6 overflow-hidden">
                                {isLoading && isCloudMode && <div className="absolute inset-0 z-10 bg-white/80 flex flex-col items-center justify-center backdrop-blur-sm rounded-xl"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600 mb-2"></div></div>}
                                
                                <div className="mb-4 flex items-center gap-2 pb-2 border-b border-emerald-200">
                                    <Grid className="w-5 h-5 text-emerald-500" />
                                    <h2 className="text-lg font-bold text-emerald-800">班級資源區</h2>
                                    {mode === 'teacher' && <span className="ml-2 text-xs font-bold text-emerald-600 bg-emerald-100 px-2 py-1 rounded-full">可拖曳排序</span>}
                                </div>

                                {resources.length === 0 ? (
                                    <div className="flex-1 flex flex-col items-center justify-center text-center text-emerald-300">
                                        <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-3 shadow-sm"><FileText className="w-8 h-8 text-emerald-200"/></div>
                                        <p className="font-bold">目前沒有資源</p>
                                    </div>
                                ) : (
                                    <div className="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-1">
                                        {resources.map((item, index) => (
                                            <div 
                                                key={item.id} 
                                                className={`bg-white rounded-xl shadow-sm border border-emerald-100 transition-all hover:shadow-md flex items-stretch overflow-hidden group ${mode === 'teacher' ? 'draggable-item' : ''}`}
                                                draggable={mode === 'teacher'}
                                                onDragStart={(e) => handleDragStart(e, index)}
                                                onDragEnter={(e) => handleDragEnter(e, index)}
                                                onDragEnd={handleDragEnd}
                                                onDragOver={(e) => e.preventDefault()}
                                            >
                                                {/* Drag Handle (Teacher only) */}
                                                {mode === 'teacher' && (
                                                    <div className="bg-emerald-50 w-8 flex items-center justify-center border-r border-emerald-100 cursor-grab active:cursor-grabbing text-emerald-300 hover:text-emerald-500">
                                                        <GripVertical className="w-5 h-5" />
                                                    </div>
                                                )}
                                                
                                                <div className="flex-1 p-4 flex flex-col justify-center min-w-0">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <h3 className="text-lg font-bold text-slate-800 truncate">{renderContent(item.title)}</h3>
                                                        {item.url && (
                                                            <a href={item.url} target="_blank" rel="noopener noreferrer" className="text-emerald-500 hover:text-emerald-700 bg-emerald-50 p-1 rounded hover:bg-emerald-100" title="開啟連結">
                                                                <ExternalLink className="w-4 h-4" />
                                                            </a>
                                                        )}
                                                    </div>
                                                    <p className="text-sm text-slate-500 font-medium whitespace-pre-wrap">{item.description}</p>
                                                </div>

                                                {mode === 'teacher' && (
                                                    <div className="flex flex-col border-l border-emerald-50">
                                                        <button onClick={() => handleEditResource(item)} className="flex-1 px-3 hover:bg-blue-50 text-slate-300 hover:text-blue-500 transition-colors border-b border-emerald-50">
                                                            <Edit3 className="w-5 h-5"/>
                                                        </button>
                                                        <button onClick={() => handleDeleteResource(item.id)} className="flex-1 px-3 hover:bg-rose-50 text-slate-300 hover:text-rose-500 transition-colors">
                                                            <Trash2 className="w-5 h-5"/>
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
						{/* 4. 交辦幹部 (Cadre) */}
						{viewMode === 'cadre' && (
							<CadreTaskSection 
								isTeacherMode={mode === 'teacher'} 
								db={db} 
								tasks={cadreTasks}  
							/>
						)}
                    </main>

                    {/* Modals */}
                    <Modal isOpen={showCalendarModal} onClose={() => setShowCalendarModal(false)} title="選擇日期" size="w-full h-full md:max-w-md md:h-auto" footer={<button onClick={() => setShowCalendarModal(false)} className="w-full py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700 font-bold">關閉</button>}>
                        <CalendarSidebar 
                            selectedDate={selectedDate} 
                            setSelectedDate={setSelectedDate} 
                            todayStr={todayStr} 
                            availableDatesMap={availableDatesMap} 
                            renderCalendarGrid={renderCalendarGrid} 
                            closeModal={() => setShowCalendarModal(false)}
                        />
                    </Modal>

                    <Modal isOpen={isImportModalOpen} onClose={() => {setIsImportModalOpen(false); setPendingImportData(null);}} title="匯入資料確認" footer={<><button onClick={() => {setIsImportModalOpen(false); setPendingImportData(null);}} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-bold">取消</button><button onClick={confirmImport} className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md shadow-blue-200">確認匯入</button></>}>
                        <div className="flex flex-col items-center text-center p-4"><div className="bg-blue-50 p-4 rounded-full mb-4"><FileUp className="w-10 h-10 text-blue-500" /></div><h4 className="text-xl font-bold text-slate-800 mb-2">準備匯入舊有資料</h4><p className="text-slate-500 mb-4">檔案日期: <span className="font-bold text-slate-700">{pendingImportData?.timestamp ? new Date(pendingImportData.timestamp).toLocaleDateString() : '未知'}</span></p></div>
                    </Modal>

                    <Modal isOpen={isFormOpen} onClose={() => setIsFormOpen(false)} title={formMode === 'add' ? "新增事項" : "編輯科目事項"} size="max-w-2xl" footer={<><button onClick={() => setIsFormOpen(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-bold">取消</button><button onClick={handleSubmit} className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md shadow-blue-200">儲存</button></>}>
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <div><label className="block text-sm font-bold text-slate-700 mb-1">日期</label><input type="date" value={formDate} onChange={(e) => setFormDate(e.target.value)} className={`w-full p-2 rounded-lg border border-slate-200 font-bold text-slate-700 ${formMode === 'edit-group' ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'focus:ring-2 focus:ring-blue-200'}`} disabled={formMode === 'edit-group'} /></div>
                                <div><label className="block text-sm font-bold text-slate-700 mb-1">科目</label><select value={formSubject} onChange={(e) => setFormSubject(e.target.value)} className="w-full p-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-200 font-bold text-slate-700" disabled={formMode === 'edit-group'}>{SUBJECT_CONFIG.map(s=><option key={s.name} value={s.name}>{s.name}</option>)}</select></div>
                            </div>
                            <div className="space-y-3">
                                <label className="block text-sm font-bold text-slate-700">內容細項 <FormatHelp /></label>
                                {formItems.map((item, index) => (
                                    <div key={item.id} className="flex gap-2 items-start animate-fade-in border-b border-slate-100 pb-3 mb-2 last:border-0">
                                        <div className="flex-shrink-0 pt-2 text-slate-400 font-bold w-6 text-center">{index + 1}.</div>
                                        <div className="flex-1 space-y-2">
                                            <div className="flex gap-2">
                                                <select value={item.type} onChange={(e) => updateFormItem(item.id, 'type', e.target.value)} className="w-24 p-2 rounded-lg border border-slate-200 text-sm font-bold bg-white focus:ring-2 focus:ring-blue-200"><option value="exam">考試</option><option value="homework">作業</option><option value="report">報告</option><option value="reminder">提醒</option><option value="other">其他</option></select>
                                                <input type="text" value={item.content} onChange={(e) => updateFormItem(item.id, 'content', e.target.value)} placeholder="輸入事項內容..." className="flex-1 p-2 rounded-lg border border-slate-200 text-sm font-bold focus:ring-2 focus:ring-blue-200" />
												
												{/* ★ 置頂勾選框 (請確認有這一段) */}
												<label className="flex items-center gap-1 cursor-pointer px-1 select-none" title="本日置頂">
													<input 
														type="checkbox" 
														checked={item.isPinned || false} 
														onChange={(e) => updateFormItem(item.id, 'isPinned', e.target.checked)} 
														className="w-4 h-4 text-orange-500 rounded border-gray-300 focus:ring-orange-500"
													/>
													<Pin className={`w-4 h-4 ${item.isPinned ? 'text-orange-500 fill-orange-500' : 'text-slate-300'}`} />
												</label>  
											</div>
                                            <div className="flex gap-2 items-center text-xs pl-1">
                                                <span className="text-slate-400 font-bold">截止:</span>
                                                <input type="date" value={item.deadline} onChange={(e) => updateFormItem(item.id, 'deadline', e.target.value)} className="p-1 border border-slate-200 rounded bg-white text-slate-600 w-32" />
                                            </div>
                                        </div>
                                        <button onClick={() => removeFormItemRow(item.id)} className="p-2 text-slate-300 hover:text-rose-500 mt-1"><X className="w-4 h-4"/></button>
                                    </div>
                                ))}
                                <button onClick={addFormItemRow} className="w-full py-2 border-2 border-dashed border-slate-200 rounded-lg text-slate-400 font-bold hover:border-blue-300 hover:text-blue-500 flex items-center justify-center gap-2"><Plus className="w-4 h-4"/> 新增細項</button>
                            </div>
                        </div>
                    </Modal>

                    {/* Bulletin Form Modal */}
                    <Modal isOpen={isBulletinFormOpen} onClose={() => setIsBulletinFormOpen(false)} title={bulletinForm.id ? "編輯公告" : "發布新公告"} footer={<><button onClick={() => setIsBulletinFormOpen(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-bold">取消</button><button onClick={handleBulletinSubmit} className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md">{bulletinForm.id ? "更新" : "發布"}</button></>}>
                         <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">公告標題 <FormatHelp /></label>
                                <input type="text" value={bulletinForm.content} onChange={(e) => setBulletinForm({...bulletinForm, content: e.target.value})} placeholder="例如：化學奧林匹亞報名連結" className="w-full p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-200 font-bold" autoFocus />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">截止日期</label>
                                <input type="date" value={bulletinForm.deadline} onChange={(e) => setBulletinForm({...bulletinForm, deadline: e.target.value})} className="w-full p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-200 font-bold text-slate-700" />
                                <p className="text-xs text-slate-400 mt-1">若未設定，將預設為 7 天後</p>
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">詳細說明/連結</label>
                                <textarea rows="4" value={bulletinForm.details} onChange={(e) => setBulletinForm({...bulletinForm, details: e.target.value})} placeholder="請輸入詳細內容或相關網址..." className="w-full p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-200 font-medium text-sm"></textarea>
                            </div>
                        </div>
                    </Modal>

                    {/* Resource Form Modal */}
                    <Modal isOpen={isResourceFormOpen} onClose={() => setIsResourceFormOpen(false)} title={resourceForm.id ? "編輯資源" : "新增資源"} footer={<><button onClick={() => setIsResourceFormOpen(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-bold">取消</button><button onClick={handleResourceSubmit} className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold shadow-md">{resourceForm.id ? "更新" : "新增"}</button></>}>
                         <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">資源名稱 <FormatHelp /> </label>
                                <input type="text" value={resourceForm.title} onChange={(e) => setResourceForm({...resourceForm, title: e.target.value})} placeholder="例如：班級課表、線上教室連結" className="w-full p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-200 font-bold" autoFocus />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">連結網址</label>
                                <input type="url" value={resourceForm.url} onChange={(e) => setResourceForm({...resourceForm, url: e.target.value})} placeholder="https://..." className="w-full p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-200 font-medium text-slate-600" />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">描述說明</label>
                                <textarea rows="3" value={resourceForm.description} onChange={(e) => setResourceForm({...resourceForm, description: e.target.value})} placeholder="簡短說明..." className="w-full p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-200 font-medium text-sm"></textarea>
                            </div>
                        </div>
                    </Modal>
                    
                    <Modal isOpen={isDeleteAnnouncementModalOpen} onClose={() => setIsDeleteAnnouncementModalOpen(false)} title="確認刪除" footer={<><button onClick={() => setIsDeleteAnnouncementModalOpen(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-bold">取消</button><button onClick={confirmDeleteAnnouncement} className="px-6 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg font-bold shadow-md">確認刪除</button></>}>
                        <div className="flex flex-col items-center text-center p-4"><div className="bg-rose-50 p-4 rounded-full mb-4"><Trash2 className="w-8 h-8 text-rose-500" /></div><p className="text-slate-600 font-bold text-lg">確定要刪除這則公告嗎？</p></div>
                    </Modal>

                    <Modal isOpen={isDeleteResourceModalOpen} onClose={() => setIsDeleteResourceModalOpen(false)} title="確認刪除" footer={<><button onClick={() => setIsDeleteResourceModalOpen(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-bold">取消</button><button onClick={confirmDeleteResource} className="px-6 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg font-bold shadow-md">確認刪除</button></>}>
                        <div className="flex flex-col items-center text-center p-4"><div className="bg-rose-50 p-4 rounded-full mb-4"><Trash2 className="w-8 h-8 text-rose-500" /></div><p className="text-slate-600 font-bold text-lg">確定要刪除這個資源嗎？</p></div>
                    </Modal>

                    <Modal isOpen={isPasswordModalOpen} onClose={() => setIsPasswordModalOpen(false)} title="權限驗證" footer={<button onClick={checkPassword} className="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold">確認</button>}>
                        <div className="space-y-3"><p className="text-sm text-slate-600">請輸入導師密碼：</p><input type="password" autoFocus value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && checkPassword()} className="w-full p-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-200" placeholder="預設密碼: 000000" />{passwordError && <p className="text-xs text-rose-500 font-bold">密碼錯誤</p>}</div>
                    </Modal>

                    <Modal isOpen={isSettingsModalOpen} onClose={() => setIsSettingsModalOpen(false)} title="系統設定" footer={<button onClick={handleSaveSettings} className="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold">儲存設定</button>}>
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-3 mb-2 border-b border-slate-100 pb-4">
                                <button onClick={handleImportClick} className="flex items-center justify-center gap-2 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">
                                    <Upload className="w-4 h-4"/> 匯入資料
                                </button>
                                <button onClick={handleFullExport} className="flex items-center justify-center gap-2 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">
                                    <Download className="w-4 h-4"/> 備份資料
                                </button>
                            </div>
                            <div className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                                <div className="flex items-center gap-2">
                                    {settings.passwordEnabled ? <Lock className="w-5 h-5 text-blue-500"/> : <Unlock className="w-5 h-5 text-slate-400"/>}
                                    <span className="font-bold text-slate-700">啟用密碼保護</span>
                                </div>
                                <label className="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" className="sr-only peer" checked={settings.passwordEnabled} onChange={(e) => setSettings({...settings, passwordEnabled: e.target.checked})} />
                                    <div className="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                                </label>
                            </div>
                            {settings.passwordEnabled && (
                                <div className="space-y-3 pt-2">
                                    <h4 className="text-sm font-bold text-slate-500">修改密碼</h4>
                                    <input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} className="w-full p-2 border border-slate-200 rounded-lg text-sm" placeholder="新密碼" />
                                    <input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="w-full p-2 border border-slate-200 rounded-lg text-sm" placeholder="確認新密碼" />
                                </div>
                            )}
                            <div className="pt-2 border-t border-slate-100 mt-2">
                                <button onClick={onRemoveDuplicatesClick} className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-bold">移除重複資料</button>
                            </div>
                        </div>
                    </Modal>

                    <Modal isOpen={isDeleteAlertOpen} onClose={() => setIsDeleteAlertOpen(false)} title="確認刪除" footer={<><button onClick={() => setIsDeleteAlertOpen(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-bold">取消</button><button onClick={executeDeleteGroup} className="px-6 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg font-bold shadow-md">刪除</button></>}>
                        <div className="flex flex-col items-center text-center p-4"><div className="bg-rose-50 p-4 rounded-full mb-4"><Trash2 className="w-8 h-8 text-rose-500" /></div><p className="text-slate-600 font-bold text-lg">確定要刪除這整組事項嗎？</p></div>
                    </Modal>

                    <Modal isOpen={isSavePromptOpen} onClose={() => setIsSavePromptOpen(false)} title="投影模式" footer={<button onClick={() => { setIsSavePromptOpen(false); setIsPresenting(true); }} className="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md">進入投影</button>}>
                        <div className="flex flex-col items-center text-center p-4"><div className="bg-blue-50 p-4 rounded-full mb-4"><Maximize className="w-10 h-10 text-blue-500" /></div><h4 className="text-xl font-bold text-slate-800 mb-2">確認進入投影模式？</h4></div>
                    </Modal>

                    <Modal isOpen={generalAlert.isOpen} onClose={() => setGeneralAlert({ ...generalAlert, isOpen: false })} title={generalAlert.title} footer={<button onClick={() => setGeneralAlert({ ...generalAlert, isOpen: false })} className="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold">確認</button>}>
                        <div className="flex flex-col items-center text-center p-4"><div className="bg-blue-50 p-4 rounded-full mb-4"><AlertTriangle className="w-10 h-10 text-blue-500" /></div><p className="text-slate-600 font-bold">{generalAlert.message}</p></div>
                    </Modal>

                    <Modal isOpen={isRemoveDupConfirmOpen} onClose={() => setIsRemoveDupConfirmOpen(false)} title="移除重複" footer={<><button onClick={() => setIsRemoveDupConfirmOpen(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-bold">取消</button><button onClick={executeRemoveDuplicates} className="px-6 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg font-bold shadow-md">執行</button></>}>
                         <div className="flex flex-col items-center text-center p-4"><div className="bg-rose-50 p-4 rounded-full mb-4"><Trash2 className="w-10 h-10 text-rose-500" /></div><h4 className="text-xl font-bold text-slate-800 mb-2">確認移除重複資料？</h4></div>
                    </Modal>

                    <Modal isOpen={isImportPreviousConfirmOpen} onClose={() => setIsImportPreviousConfirmOpen(false)} title="匯入確認" footer={<><button onClick={() => setIsImportPreviousConfirmOpen(false)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-bold">取消</button><button onClick={confirmImportPrevious} className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold shadow-md">確認匯入</button></>}>
                         <div className="flex flex-col items-center text-center p-4"><div className="bg-emerald-50 p-4 rounded-full mb-4"><History className="w-10 h-10 text-emerald-500" /></div><h4 className="text-xl font-bold text-slate-800 mb-2">匯入前次內容</h4><p className="text-slate-500">將會匯入前一天的內容到今日。</p></div>
                    </Modal>
					
					<Modal isOpen={isAlertModalOpen} Close={() => setIsAlertModalOpen(false)} 
						title="系統提示" 
						footer={
							<button 
								onClick={() => setIsAlertModalOpen(false)} 
								className="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-bold shadow-md transition-colors"
							>
								我知道了
							</button>
						}
					>
						<div className="flex flex-col items-center text-center p-4">
							<div className="bg-amber-50 p-4 rounded-full mb-4">
								{/* 注意：如果你發現 AlertCircle 沒出現，可以改成 AlertTriangle */}
								<AlertTriangle className="w-10 h-10 text-amber-500" />
							</div>
							<p className="text-slate-600 font-bold">
								{alertModalMessage}
							</p>
						</div>
					</Modal>										
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ClassPlanner />);
    </script>
</body>
</html>
